# Dedicated build for the Samsung Galaxy S20 5G (x1q) port.
# Keep the package list in sync with main.yml when the toolchain changes.
#
# This exists separately from main.yml so that pushing the x1q branch to a
# fork builds only one image instead of the full ~18 device matrix.

name: x1q Build

on:
  push:
    branches: [x1q]
  workflow_dispatch:

jobs:
  build:
    name: Build boot-x1q.img
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev clang llvm lld iasl nasm \
            gcc-aarch64-linux-gnu python3-pil python3-git gettext

      - name: Toolchain info
        run: |
          uname -a
          clang --version | head -n 2
          aarch64-linux-gnu-gcc --version | head -n 1
          iasl -v 2>&1 | head -n 3 || true
          python3 --version

      # pipefail is required: without it `| tee` hides a failing build.sh.
      - name: Build
        run: |
          set -o pipefail
          ./build.sh --device x1q 2>&1 | tee build.log
          ls -l boot-x1q.img

      # Always upload the build log, including on failure, so the reason for a
      # failed run is visible without the Actions web UI.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1q-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x1q
          path: ./*.img
          if-no-files-found: error
